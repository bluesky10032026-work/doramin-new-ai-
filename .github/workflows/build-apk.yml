name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Doraemon AI Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & build web bundle
        run: |
          npm ci || npm install
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: |
          cd android
          chmod +x gradlew || true

      - name: Build Android Debug APK
        run: |
          cd android
          gradle assembleDebug || ./gradlew assembleDebug

      - name: Locate and Prepare APK
        run: |
          mkdir -p output-apk
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output-apk/doraemon-ai-release.apk \;
          ls -la output-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doraemon-ai-apk
          path: output-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Doraemon AI Android App v1.0.0"
          body: |
            ### 🤖 Doraemon AI - Android APK Release
            - Voice-first & text AI assistant with Google Gemini Live API
            - Electric Blue Male Mode (`Puck`) & Spicy Crimson Red Female Mode (`Kore`)
            - Real-time Web Audio PCM streaming & Browser function calling
            
            **Download the attached APK below to install on your Android device!**
          files: output-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
