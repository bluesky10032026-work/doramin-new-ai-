name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Doraemon AI Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Android APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output-apk
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output-apk/doraemon-ai-release.apk \;
          ls -lh output-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doraemon-ai-release-apk
          path: output-apk/doraemon-ai-release.apk
          retention-days: 30

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Doraemon AI Android APK v1.0.0"
          body: |
            ### 🤖 Doraemon AI - Android APK Release
            - Dual personality: Electric Blue Male (`Puck`) & Spicy Crimson Red Female (`Kore`)
            - Real-time voice & text interaction with Google Gemini Live
            - Full audio streaming & WebRTC microphone support
            
            **Download `doraemon-ai-release.apk` below to install directly on your Android device!**
          files: output-apk/doraemon-ai-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
